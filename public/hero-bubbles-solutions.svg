<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <!-- Bubble 1 — large teal -->
    <radialGradient id="b1" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="45%" stop-color="rgba(0,140,149,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,49,60,0.5)"/>
    </radialGradient>
    <!-- Bubble 2 — medium orange -->
    <radialGradient id="b2" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="40%" stop-color="rgba(224,78,57,0.4)"/>
      <stop offset="100%" stop-color="rgba(180,50,30,0.5)"/>
    </radialGradient>
    <!-- Bubble 3 — small mint -->
    <radialGradient id="b3" cx="40%" cy="28%" r="58%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="50%" stop-color="rgba(119,226,195,0.35)"/>
      <stop offset="100%" stop-color="rgba(77,201,165,0.45)"/>
    </radialGradient>
    <!-- Bubble 4 — large orange glow -->
    <radialGradient id="b4" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="35%" stop-color="rgba(224,78,57,0.25)"/>
      <stop offset="100%" stop-color="rgba(140,40,20,0.4)"/>
    </radialGradient>
    <!-- Bubble 5 — tiny teal -->
    <radialGradient id="b5" cx="36%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="50%" stop-color="rgba(0,140,149,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,80,90,0.4)"/>
    </radialGradient>
    <!-- Bubble 6 — medium mint -->
    <radialGradient id="b6" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="45%" stop-color="rgba(119,226,195,0.3)"/>
      <stop offset="100%" stop-color="rgba(60,170,140,0.4)"/>
    </radialGradient>
    <!-- Bubble 7 — small orange -->
    <radialGradient id="b7" cx="40%" cy="28%" r="56%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="45%" stop-color="rgba(224,78,57,0.35)"/>
      <stop offset="100%" stop-color="rgba(160,45,25,0.45)"/>
    </radialGradient>
    <!-- Bubble 8 — large teal deep -->
    <radialGradient id="b8" cx="35%" cy="34%" r="62%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="40%" stop-color="rgba(0,140,149,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,49,60,0.35)"/>
    </radialGradient>
    <!-- Bubble 9 — tiny orange -->
    <radialGradient id="b9" cx="38%" cy="30%" r="54%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="50%" stop-color="rgba(224,78,57,0.3)"/>
      <stop offset="100%" stop-color="rgba(180,50,30,0.4)"/>
    </radialGradient>
    <!-- Bubble 10 — medium teal -->
    <radialGradient id="b10" cx="36%" cy="30%" r="58%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="45%" stop-color="rgba(0,140,149,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,70,80,0.4)"/>
    </radialGradient>
  </defs>

  <!-- Background — dark left → orange right gradient -->
  <rect x="0" y="0" width="1200" height="600" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="25%" stop-color="#1a1210"/>
      <stop offset="50%" stop-color="#3a1f18"/>
      <stop offset="75%" stop-color="#6b3020"/>
      <stop offset="100%" stop-color="#E04E39"/>
    </linearGradient>
  </defs>

  <!-- Subtle glow on right -->
  <ellipse cx="1050" cy="300" rx="350" ry="280" fill="rgba(224,78,57,0.12)"/>

  <!-- Bubble 1 — large teal, top-right area -->
  <circle cx="920" cy="120" r="85" fill="url(#b1)" opacity="0.85"/>
  <ellipse cx="900" cy="100" rx="30" ry="12" fill="rgba(255,255,255,0.2)" transform="rotate(-15 900 100)"/>
  <path d="M 955 85 Q 960 78 970 82" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>

  <!-- Bubble 2 — medium orange, center-right -->
  <circle cx="780" cy="320" r="65" fill="url(#b2)" opacity="0.9"/>
  <ellipse cx="765" cy="303" rx="22" ry="9" fill="rgba(255,255,255,0.2)" transform="rotate(-10 765 303)"/>

  <!-- Bubble 3 — small mint, upper area -->
  <circle cx="650" cy="160" r="40" fill="url(#b3)" opacity="0.8"/>
  <ellipse cx="640" cy="148" rx="14" ry="5" fill="rgba(255,255,255,0.25)" transform="rotate(-12 640 148)"/>

  <!-- Bubble 4 — large orange glow, bottom-right -->
  <circle cx="1050" cy="420" r="100" fill="url(#b4)" opacity="0.7"/>
  <ellipse cx="1030" cy="395" rx="35" ry="14" fill="rgba(255,255,255,0.15)" transform="rotate(-8 1030 395)"/>
  <path d="M 1090 385 Q 1098 378 1110 382" stroke="rgba(255,255,255,0.1)" stroke-width="2" fill="none"/>

  <!-- Bubble 5 — tiny teal, mid-left -->
  <circle cx="580" cy="400" r="28" fill="url(#b5)" opacity="0.85"/>
  <ellipse cx="573" cy="391" rx="10" ry="4" fill="rgba(255,255,255,0.3)" transform="rotate(-15 573 391)"/>

  <!-- Bubble 6 — medium mint, right-center -->
  <circle cx="870" cy="260" r="50" fill="url(#b6)" opacity="0.75"/>
  <ellipse cx="858" cy="247" rx="18" ry="7" fill="rgba(255,255,255,0.2)" transform="rotate(-10 858 247)"/>

  <!-- Bubble 7 — small orange, upper-right -->
  <circle cx="1020" cy="180" r="35" fill="url(#b7)" opacity="0.85"/>
  <ellipse cx="1012" cy="170" rx="12" ry="5" fill="rgba(255,255,255,0.25)" transform="rotate(-12 1012 170)"/>

  <!-- Bubble 8 — large teal deep, bottom -->
  <circle cx="700" cy="480" r="75" fill="url(#b8)" opacity="0.6"/>
  <ellipse cx="682" cy="458" rx="26" ry="10" fill="rgba(255,255,255,0.12)" transform="rotate(-10 682 458)"/>

  <!-- Bubble 9 — tiny orange, scattered -->
  <circle cx="600" cy="260" r="20" fill="url(#b9)" opacity="0.8"/>
  <ellipse cx="595" cy="254" rx="7" ry="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Bubble 10 — medium teal, far right -->
  <circle cx="1120" cy="320" r="55" fill="url(#b10)" opacity="0.65"/>
  <ellipse cx="1108" cy="305" rx="20" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-8 1108 305)"/>
</svg>
